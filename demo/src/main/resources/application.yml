server:
  port: 8080

spring:

  application:
    name: my-web-ide

  config:
    import: "optional:classpath:application-secret.yml"

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/myide?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  ide:
    docker:
      host: ${DOCKER_HOST_URL:tcp://localhost:2375}
      workspace-path: ${IDE_WORKSPACE_PATH:./temp-workspace}

ide:
  users-root: ${IDE_USERS_ROOT:C:\WebIDE\users}
  # 안전 실행·샌드박스가 쓰는 폴더(green / sandbox / runs). 사용자 개인 폴더 밖에 둔다.
  # 운영(Linux)에서는 IDE_SAFE_RUN_ROOT 로 반드시 지정한다.
  safe-run-root: ${IDE_SAFE_RUN_ROOT:C:\WebIDE\safe-run}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://waivss.vercel.app,https://*.vercel.app,http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*,http://172.17.*.*:*,http://172.18.*.*:*,http://172.19.*.*:*,http://172.20.*.*:*,http://172.21.*.*:*,http://172.22.*.*:*,http://172.23.*.*:*,http://172.24.*.*:*,http://172.25.*.*:*,http://172.26.*.*:*,http://172.27.*.*:*,http://172.28.*.*:*,http://172.29.*.*:*,http://172.30.*.*:*,http://172.31.*.*:*}

google:
  gemini:
    # 최종 보고서에만 쓰는 모델. 공통 google.gemini.url(application-secret.yml)의 모델 이름만 바꿔 끼우므로
    # 설계 초안·코드 도우미 등 다른 AI 기능의 모델은 그대로다.
    # 되돌리기: GEMINI_REPORT_MODEL 을 빈 값으로 두면 공통 모델(gemini-2.5-flash)로 돌아간다.
    report:
      model: ${GEMINI_REPORT_MODEL:gemini-3.5-flash-lite}

jwt:
  secret: ${JWT_SECRET:aW52YWxpZC1zZWNyZXQta2V5LXRlc3QtdmFsdWUtZm9yLWNhcHN0b25lLXByb2plY3Q=}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 1209600000

auth:
  refresh-cookie:
    name: refreshToken
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

github:
  client:
    id: ${GITHUB_CLIENT_ID:}
    secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/auth/github/callback}